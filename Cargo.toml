[package]
name = "thumbnail"
description = "A home page of thumbnails for the videos on your drives"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
raw-window-handle = "0.6"
rfd = "0.17.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tao = "0.37.2"
tiny_http = "0.12.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
wry = "0.57.1"

[profile.release]
opt-level = "s"     # small exe
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
